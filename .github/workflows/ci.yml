name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm          # reuse downloaded packages between runs
      - run: npm ci           # clean install, exactly per the lockfile
      - run: npm run lint
      - run: npm run test
      - run: npm run build
  docker:
    needs: ci                                  # only runs if the ci job passed
    if: github.event_name == 'push'            # merges to main only — not PRs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                          # lets GITHUB_TOKEN push to GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker build \
            -t ghcr.io/vicKituku/sample-app:${{ github.sha }} \
            -t ghcr.io/vicKituku/sample-app:latest .
          docker push --all-tags ghcr.io/vicKituku/sample-app
        

    