name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm          # reuse downloaded packages between runs
      - run: npm ci           # clean install, exactly per the lockfile
      - run: npm run lint
      - run: npm run test
      - run: npm run build

    